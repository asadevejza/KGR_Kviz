<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KGR Kviz — 186 pitanja</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f6f2;
  --surface:#ffffff;
  --border:#e8e6df;
  --border-hover:#c8c5bc;
  --text:#1a1a1a;
  --text-muted:#6b6966;
  --text-hint:#a09d97;
  --radius:14px;
  --radius-sm:9px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:2rem 1rem}
.w{max-width:680px;margin:0 auto}

/* MENU */
.header{margin-bottom:2rem}
.header h1{font-size:22px;font-weight:600;letter-spacing:-.3px}
.header p{font-size:14px;color:var(--text-muted);margin-top:5px}
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:1.25rem 0}
@media(max-width:520px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.mc{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:1rem .75rem;cursor:pointer;text-align:center;transition:all .15s;border-top-width:4px;box-shadow:var(--shadow)}
.mc:hover{border-color:var(--border-hover);transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.mc.done{opacity:.85}
.mn{font-size:22px;font-weight:700;line-height:1}
.ml{font-size:11px;color:var(--text-muted);margin-top:5px;line-height:1.4}
.ms{font-size:10px;font-weight:600;margin-top:5px}
.tot{margin-top:.75rem;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;color:var(--text-muted)}
.tot strong{color:var(--text)}

/* PROGRESS */
.quiz-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.bk{font-size:13px;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:4px 0;display:flex;align-items:center;gap:5px;transition:color .15s}
.bk:hover{color:var(--text)}
.score-badge{font-size:13px;color:var(--text-muted)}
.pb{height:5px;background:var(--border);border-radius:3px;margin-bottom:1.25rem;overflow:hidden}
.pf{height:5px;border-radius:3px;transition:width .4s cubic-bezier(.4,0,.2,1)}

/* QUESTION CARD */
.qc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1rem;box-shadow:var(--shadow)}
.qn{font-size:12px;color:var(--text-hint);margin-bottom:8px;font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.qt{font-size:15px;color:var(--text);line-height:1.6;margin-bottom:1.25rem;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.ob{display:flex;align-items:flex-start;gap:12px;padding:11px 14px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);cursor:pointer;text-align:left;font-size:14px;color:var(--text);transition:all .15s;width:100%;line-height:1.45}
.ob:hover:not(:disabled){background:#f5f4ef;border-color:var(--border-hover)}
.ob .l{font-weight:700;min-width:20px;font-size:12px;color:var(--text-hint);flex-shrink:0;margin-top:1px}
.ob.cor{background:#eaf3de;border-color:#639922}
.ob.cor .l{color:#3B6D11}
.ob.wr{background:#fcebeb;border-color:#A32D2D}
.ob.wr .l{color:#A32D2D}
.ob.sel{background:#EEEDFE;border-color:#534AB7}
.ob.sel .l{color:#534AB7}
.ob:disabled{cursor:default}

/* FEEDBACK */
.fb{margin-top:12px;padding:10px 14px;border-radius:var(--radius-sm);font-size:13px;line-height:1.55;display:flex;align-items:flex-start;gap:9px}
.fb-icon{font-size:15px;flex-shrink:0;margin-top:1px}
.fb.ok{background:#eaf3de;color:#3B6D11}
.fb.no{background:#fcebeb;color:#A32D2D}



/* NAV */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:.5rem}
.nb{padding:9px 20px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;transition:all .15s}
.nb:hover:not(:disabled){background:#f0efe9;border-color:var(--border-hover)}
.nb:disabled{opacity:.3;cursor:default}
.nb.p{background:#534AB7;border-color:#534AB7;color:#fff}
.nb.p:hover:not(:disabled){background:#3C3489;border-color:#3C3489}
.nb.skip{background:transparent;border-color:transparent;color:var(--text-muted);font-size:13px;padding:9px 12px}
.nb.skip:hover:not(:disabled){color:var(--text);background:var(--surface);border-color:var(--border)}
.nav-center{font-size:13px;color:var(--text-hint)}

/* RESULTS */
.sc{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:2.5rem 2rem;text-align:center;box-shadow:var(--shadow)}
.sc-icon{font-size:48px;margin-bottom:.5rem}
.sb{font-size:52px;font-weight:700;line-height:1.1;letter-spacing:-1px}
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:260px;margin:1.25rem auto}
.sx{background:var(--bg);border-radius:var(--radius-sm);padding:14px 12px}
.sx-val{font-size:24px;font-weight:700}
.sx-lbl{font-size:12px;color:var(--text-muted);margin-top:3px}
.sc-msg{font-size:14px;color:var(--text-muted);margin:8px 0 1.5rem}
.sc-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:1.5rem}

/* REVIEW */
.rv-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem 1.5rem;margin-bottom:.75rem;box-shadow:var(--shadow)}
.rv-tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px}
.rv-tag.ok{background:#eaf3de;color:#3B6D11}
.rv-tag.no{background:#fcebeb;color:#A32D2D}
.rv-q{font-size:14px;font-weight:500;color:var(--text);line-height:1.55;margin-bottom:10px}
.rv-opt{font-size:13px;padding:7px 12px;border-radius:var(--radius-sm);margin-bottom:5px;display:flex;align-items:flex-start;gap:9px;line-height:1.4}
.rv-opt.cor{background:#eaf3de;color:#3B6D11}
.rv-opt.wr{background:#fcebeb;color:#A32D2D}
.rv-opt.neu{background:var(--bg);color:var(--text-muted)}
.rv-opt .l{font-weight:700;font-size:12px;min-width:18px;flex-shrink:0}

/* MISTAKES CARD */
.mc-err{background:var(--surface);border:1.5px solid #e8c8c8;border-radius:var(--radius);padding:1rem .75rem;cursor:pointer;text-align:center;transition:all .15s;border-top-width:4px;box-shadow:var(--shadow);border-top-color:#A32D2D}
.mc-err:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
</style>
</head>

<div class="w"><div id="root"></div></div>

function qs(i){ return mistakeMode ? mistakeQuestions : Q.slice(SETS[i].r[0],SETS[i].r[1]+1); }

function renderMenu(){
  mistakeMode=false;
  let h=`<div class="header"><h1>KGR — Kompjuterska grafika i rasterizacija</h1><p>186 pitanja podijeljena u 5 kvizova + parcijalni + parcijalni 2026. Odaberi jedan i uradi ga u svom tempu.</p></div>`;
  h+=`<div class="mgrid">`;
  SETS.forEach((s,i)=>{
    const q=qs(i);
    const done=scores[i]!==null;
    h+=`<div class="mc${done?' done':''}" onclick="startSet(${i})" style="border-top-color:${s.col}">`;
    h+=`<div class="mn" style="color:${s.col}">${i+1}</div>`;
    h+=`<div class="ml">${s.t}<br><span style="color:#aaa;font-size:10px">${q.length} pitanja</span></div>`;
    if(done) h+=`<div class="ms" style="color:${s.col}">${scores[i].n}/${scores[i].t} ✓</div>`;
    h+=`</div>`;
  });
  h+=`</div>`;
  const totN=scores.filter(s=>s!==null).reduce((a,s)=>a+s.n,0);
  const totT=scores.filter(s=>s!==null).reduce((a,s)=>a+s.t,0);
  if(totT>0){
    const pct=Math.round(totN/totT*100);
    h+=`<div class="tot">Ukupni rezultat: <strong>${totN}/${totT}</strong> tačnih — ${pct}%</div>`;
  }
  // Show mistakes quiz card if there are any accumulated mistakes
  if(mistakeSet.length>0){
    h+=`<div style="margin-top:1.25rem">`;
    h+=`<div class="mc-err" onclick="startMistakesQuiz()">`;
    h+=`<div style="font-size:22px;font-weight:700;color:#A32D2D;line-height:1">✗</div>`;
    h+=`<div style="font-size:13px;font-weight:600;margin-top:6px;color:#A32D2D">Kviz grešaka</div>`;
    h+=`<div style="font-size:11px;color:var(--text-muted);margin-top:4px">${mistakeSet.length} pogrešnih pitanja</div>`;
    h+=`</div></div>`;
  }
  document.getElementById('root').innerHTML=h;
}

function startSet(i){
  mistakeMode=false;
  si=i; cur=0;
  ans=new Array(qs(i).length).fill(null);
  renderQuiz();
}

function isMulti(q){ return Array.isArray(q.c); }
function correctForQ(q){ return isMulti(q)?q.c:[q.c]; }
function arrEq(a,b){ return a.length===b.length&&[...a].sort().every((v,i)=>[...b].sort()[i]===v); }

function isAnswered(idx){ return ans[idx]!==null&&ans[idx].confirmed; }
function answerCorrect(q,a){
  if(!a||!a.confirmed) return false;
  return arrEq(a.selected, correctForQ(q));
}

function renderQuiz(){
  const questions=qs(si);
  const q=questions[cur];
  const s=mistakeMode ? {t:'Kviz grešaka',col:'#A32D2D',light:'#fcebeb'} : SETS[si];
  const confirmed=isAnswered(cur);
  const pct=Math.round((cur+1)/questions.length*100);
  const correct=ans.filter((a,i)=>answerCorrect(questions[i],a)).length;
  const done=ans.filter(a=>isAnswered(ans.indexOf(a))||a!==null&&a.confirmed).length;
  const doneCount=ans.filter(a=>a&&a.confirmed).length;
  const correctCount=ans.filter((a,i)=>answerCorrect(questions[i],a)).length;
  const isLast=cur===questions.length-1;
  const allDone=ans.every(a=>a&&a.confirmed);
  const multi=isMulti(q);
  const curSel=ans[cur]?ans[cur].selected:[];
  const correctOpts=correctForQ(q);

  let h=`<div class="quiz-header">`;
  h+=`<button class="bk" onclick="renderMenu()">← Meni</button>`;
  h+=`<span class="score-badge">${doneCount>0?correctCount+'/'+doneCount+' tačnih':s.t}</span>`;
  h+=`</div>`;
  h+=`<div class="pb"><div class="pf" style="width:${pct}%;background:${s.col}"></div></div>`;

  h+=`<div class="qc">`;
  h+=`<div class="qn">Pitanje ${cur+1} od ${questions.length}${multi?' &nbsp;·&nbsp; <span style="color:'+s.col+';font-weight:600">VIŠESTRUKI ODGOVOR</span>':''}</div>`;
  h+=`<div class="qt">${q.q}</div>`;
  h+=`<div class="opts">`;
  q.o.forEach((opt,i)=>{
    let cls='ob';
    const isSelected=curSel.includes(i);
    if(confirmed){
      const isCorrectOpt=correctOpts.includes(i);
      const wasSelected=curSel.includes(i);
      if(isCorrectOpt) cls+=' cor';
      else if(wasSelected&&!isCorrectOpt) cls+=' wr';
    } else {
      if(isSelected) cls+=' sel';
    }
    const checkmark=multi?`<span style="margin-left:auto;flex-shrink:0;font-size:13px;color:${isSelected&&!confirmed?'#534AB7':'var(--text-hint)'}">${isSelected?'☑':'☐'}</span>`:'';
    h+=`<button class="${cls}" ${confirmed?'disabled':''} onclick="${multi?'toggle':'choose'}(${i})">`;
    h+=`<span class="l">${String.fromCharCode(65+i)}.</span><span style="flex:1">${opt}</span>${checkmark}</button>`;
  });
  h+=`</div>`;

  if(multi&&!confirmed&&curSel.length>0){
    h+=`<button onclick="confirm()" style="margin-top:10px;width:100%;padding:10px;background:#534AB7;color:#fff;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:500;cursor:pointer">Potvrdi odgovor</button>`;
  }

  if(confirmed){
    const ok=answerCorrect(q,ans[cur]);
    h+=`<div class="fb ${ok?'ok':'no'}" style="margin-top:10px">`;
    h+=`<span class="fb-icon">${ok?'✓':'✗'}</span>`;
    if(ok){
      h+=`<span>Tačno!</span>`;
    } else {
      const correctLabels=correctOpts.map(i=>String.fromCharCode(65+i)+'. '+q.o[i]).join(', ');
      h+=`<span>Netačno. Tačan odgovor: <strong>${correctLabels}</strong></span>`;
    }
    h+=`</div>`;
  }
  h+=`</div>`;

  h+=`<div class="nav">`;
  h+=`<button class="nb" ${cur===0?'disabled':''} onclick="go(${cur-1})">← Nazad</button>`;
  h+=`<span class="nav-center">${cur+1} / ${questions.length}</span>`;
  if(isLast&&allDone){
    h+=`<button class="nb p" onclick="showRes()">Završi →</button>`;
  } else {
    h+=`<button class="nb p" onclick="go(${cur+1})" ${(!confirmed||isLast)?'disabled':''}>Sljedeće →</button>`;
  }
  h+=`</div>`;

  document.getElementById('root').innerHTML=h;
}

function choose(i){
  if(ans[cur]&&ans[cur].confirmed) return;
  ans[cur]={selected:[i],confirmed:true};
  renderQuiz();
}

function toggle(i){
  if(ans[cur]&&ans[cur].confirmed) return;
  const cur_sel=ans[cur]?[...ans[cur].selected]:[];
  const idx=cur_sel.indexOf(i);
  if(idx===-1) cur_sel.push(i);
  else cur_sel.splice(idx,1);
  ans[cur]={selected:cur_sel,confirmed:false};
  renderQuiz();
}

function confirm(){
  if(!ans[cur]||ans[cur].selected.length===0) return;
  ans[cur].confirmed=true;
  renderQuiz();
}

function go(n){
  const questions=qs(si);
  if(n<0||n>=questions.length) return;
  cur=n;
  renderQuiz();
}

function showRes(){
  const questions=qs(si);
  const n=ans.filter((a,i)=>answerCorrect(questions[i],a)).length;
  const t=questions.length;
  const pct=Math.round(n/t*100);

  let s;
  if(mistakeMode){
    s={t:'Kviz grešaka',col:'#A32D2D',light:'#fcebeb'};
    // Update mistake set — remove correctly answered ones
    const newWrong=[];
    questions.forEach((q,i)=>{ if(!answerCorrect(q,ans[i])) newWrong.push(mistakeSet[i]); });
    mistakeSet=newWrong;
  } else {
    // Save score and collect wrong answers
    const wrongIdxs=questions.map((q,i)=>answerCorrect(q,ans[i])?null:i).filter(i=>i!==null);
    const wrongQGlobal=wrongIdxs.map(i=>SETS[si].r[0]+i);
    wrongQGlobal.forEach(gi=>{ if(!mistakeSet.includes(gi)) mistakeSet.push(gi); });
    // Remove from mistakeSet any that were now answered correctly
    questions.forEach((q,i)=>{ if(answerCorrect(q,ans[i])){ const gi=SETS[si].r[0]+i; const idx=mistakeSet.indexOf(gi); if(idx>-1) mistakeSet.splice(idx,1); } });
    scores[si]={n,t};
    s=SETS[si];
  }

  const grade=pct>=90?'Odlično!':pct>=75?'Vrlo dobro!':pct>=60?'Dobro, ima mjesta za napredak.':'Potrebno više vježbe.';
  const icon=pct>=90?'★':pct>=75?'◆':pct>=60?'●':'○';

  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">`;
  h+=`<button class="bk" onclick="renderMenu()">← Meni</button>`;
  h+=`<span style="font-size:13px;color:var(--text-muted)">${s.t}</span></div>`;
  h+=`<div class="sc">`;
  h+=`<div class="sc-icon" style="color:${s.col}">${icon}</div>`;
  h+=`<div class="sb" style="color:${s.col}">${n}/${t}</div>`;
  h+=`<div class="sc-msg">${grade} — ${pct}% tačnih odgovora</div>`;
  h+=`<div class="sg">`;
  h+=`<div class="sx"><div class="sx-val" style="color:#3B6D11">${n}</div><div class="sx-lbl">tačnih</div></div>`;
  h+=`<div class="sx"><div class="sx-val" style="color:#A32D2D">${t-n}</div><div class="sx-lbl">netačnih</div></div>`;
  h+=`</div>`;
  h+=`<div class="sc-actions">`;
  if(mistakeMode){
    h+=`<button class="nb" onclick="startMistakesQuiz()">Ponovi greške</button>`;
  } else {
    h+=`<button class="nb" onclick="startSet(${si})">Ponovi kviz</button>`;
  }
  h+=`<button class="nb" onclick="showReview()">Pregled pitanja</button>`;
  h+=`<button class="nb p" onclick="renderMenu()">Meni →</button>`;
  h+=`</div></div>`;
  document.getElementById('root').innerHTML=h;
}

function showReview(){
  const questions=mistakeMode ? mistakeQuestions : qs(si);
  const s=mistakeMode ? {t:'Kviz grešaka',col:'#A32D2D'} : SETS[si];
  let h=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem">`;
  h+=`<button class="bk" onclick="showRes()">← Rezultati</button>`;
  h+=`<span style="font-size:13px;color:var(--text-muted)">Pregled — ${s.t}</span></div>`;
  questions.forEach((q,i)=>{
    const ok=answerCorrect(q,ans[i]);
    const correctOpts=correctForQ(q);
    const selectedOpts=ans[i]?ans[i].selected:[];
    h+=`<div class="rv-item">`;
    h+=`<span class="rv-tag ${ok?'ok':'no'}">${ok?'✓ Tačno':'✗ Netačno'}</span>`;
    h+=`<div class="rv-q">${i+1}. ${q.q}</div>`;
    q.o.forEach((opt,j)=>{
      const isCorrect=correctOpts.includes(j);
      const wasSelected=selectedOpts.includes(j);
      let cls='neu';
      if(isCorrect) cls='cor';
      else if(wasSelected&&!isCorrect) cls='wr';
      const icon=isCorrect?'✓':wasSelected?'✗':'';
      h+=`<div class="rv-opt ${cls}"><span class="l">${String.fromCharCode(65+j)}.</span><span style="flex:1">${opt}</span>${icon?`<span style="flex-shrink:0">${icon}</span>`:''}</div>`;
    });
    h+=`</div>`;
  });
  h+=`<div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:1.5rem 0">`;
  if(mistakeMode){
    h+=`<button class="nb" onclick="startMistakesQuiz()">Ponovi greške</button>`;
  } else {
    h+=`<button class="nb" onclick="startSet(${si})">Ponovi kviz</button>`;
  }
  h+=`<button class="nb p" onclick="renderMenu()">Meni →</button>`;
  h+=`</div>`;
  document.getElementById('root').innerHTML=h;
  window.scrollTo(0,0);
}

function startMistakesQuiz(){
  if(mistakeSet.length===0) return;
  mistakeQuestions=mistakeSet.map(gi=>Q[gi]);
  mistakeMode=true;
  si=-1; cur=0;
  ans=new Array(mistakeQuestions.length).fill(null);
  renderQuiz();
}


renderMenu();
</script>
</body>
</html>
